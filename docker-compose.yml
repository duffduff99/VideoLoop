services:
  videoloop:
    build: .
    image: videoloop:latest
    container_name: videoloop
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      MEDIA_ROOT: /media
      # Optional: choose/point feeds at specific subfolders (see .env.example).
      FEEDS: ${FEEDS:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DATABASE_URL: file:/data/videoloop.db
      # Per-feed passwords are passed straight through, e.g.
      # FEED_PASSWORD_PRIVATE_CLIPS: ${FEED_PASSWORD_PRIVATE_CLIPS}
    env_file:
      - .env
    volumes:
      # Persistent SQLite database.
      - videoloop-data:/data
      # Each SMB share is mounted into its own subfolder of /media. Every
      # top-level folder under /media becomes a selectable "feed", so you can
      # mount as many shares as you like — just add a volume + a named volume
      # definition below for each one.
      - media_main:/media/main:ro
      - media_family:/media/family:ro
      # - media_extra:/media/extra:ro

volumes:
  videoloop-data:

  # ---- SMB share #1 ----
  media_main:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},uid=1001,gid=1001,ro,vers=3.0"
      device: "//${SMB_HOST}/${SMB_SHARE}"

  # ---- SMB share #2 (different share, can be a different host/credentials) ----
  media_family:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB2_USER},password=${SMB2_PASSWORD},uid=1001,gid=1001,ro,vers=3.0"
      device: "//${SMB2_HOST}/${SMB2_SHARE}"

  # ---- SMB share #3 (optional) ----
  # media_extra:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: "username=${SMB3_USER},password=${SMB3_PASSWORD},uid=1001,gid=1001,ro,vers=3.0"
  #     device: "//${SMB3_HOST}/${SMB3_SHARE}"
